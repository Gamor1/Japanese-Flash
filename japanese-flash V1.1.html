<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Japanese Flashcards</title>
  <style>
    :root {
      /* ===== THEME VARIABLES (controlled by settings) ===== */
      --accent: #7c5cff;
      --accent-hover: #9478ff;
      --selected: #3d2b8c;
      --accent-soft: rgba(124, 92, 255, 0.18);

      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #242433;
      --border: #33334a;
      --text: #e8e8f0;
      --text-dim: #9999b0;
      --correct: #2ecc71;
      --wrong: #e74c3c;
      --tile: #2a2a3a;
      --tile-hover: #35354a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      line-height: 1.4;
      overflow-x: hidden;
      transition: background 0.25s, color 0.25s;
    }

    .screen {
      display: none;
      min-height: 100dvh;
      padding: 16px;
      max-width: 720px;
      margin: 0 auto;
    }

    .screen.active {
      display: block;
    }

    /* ===== HOME ===== */
    #home {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 24px;
      padding-top: 60px;
      position: relative;
    }

    #home.active {
      display: flex;
    }

    .settings-gear {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .settings-gear:hover {
      background: var(--tile-hover);
      color: var(--text);
    }

    .logo {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .logo span {
      color: var(--accent);
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 1.05rem;
      margin-bottom: 32px;
    }

    .mode-btn {
      width: 100%;
      max-width: 320px;
      padding: 18px 24px;
      font-size: 1.2rem;
      font-weight: 600;
      border: none;
      border-radius: 16px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .mode-btn:hover {
      background: var(--accent-hover);
    }

    .mode-btn:active {
      transform: scale(0.98);
    }

    .mode-btn.alt {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .mode-btn.alt:hover {
      background: var(--tile-hover);
    }

    .mode-btn + .mode-btn {
      margin-top: 12px;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .choice-btn {
      min-height: 64px;
      padding: 14px 10px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.12s;
    }

    .choice-btn.kana {
      font-size: 1.8rem;
    }

    .choice-btn.correct {
      background: var(--correct);
      border-color: var(--correct);
      color: #06210f;
    }

    .choice-btn.wrong {
      background: var(--wrong);
      border-color: var(--wrong);
      color: #2a0a08;
    }

    .choice-btn:disabled {
      cursor: default;
    }

    #results {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
    }

    #results.active {
      display: flex;
    }

    .results-pct {
      font-size: 4.5rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .results-pct.good {
      color: var(--correct);
    }

    .results-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .results-sub {
      color: var(--text-dim);
      margin-bottom: 20px;
    }

    /* ===== SETUP ===== */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .back-btn {
      background: var(--surface2);
      border: none;
      color: var(--text);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .back-btn:hover {
      background: var(--tile-hover);
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 600;
    }

    .section {
      background: var(--surface);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Quick Add */
    .quick-adds {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quick-row {
      display: flex;
      gap: 8px;
    }

    .quick-btn {
      flex: 1;
      padding: 15px 8px;
      border: 2px solid transparent;
      border-radius: 12px;
      background: var(--surface2);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }

    .quick-btn:hover {
      background: var(--tile-hover);
    }

    .quick-btn.active {
      background: var(--selected);
      border-color: var(--accent);
      color: white;
    }

    .quick-btn.clear-btn {
      align-self: flex-end;
      flex: 0 0 auto;
      padding: 8px 14px;
      font-size: 0.82rem;
      font-weight: 500;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
    }

    .quick-btn.clear-btn:hover {
      background: var(--surface2);
      color: var(--text);
    }

    /* Script tabs */
    .script-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .script-tab {
      flex: 1;
      padding: 12px 8px;
      border: none;
      border-radius: 10px;
      background: var(--surface2);
      color: var(--text-dim);
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .script-tab.active {
      background: var(--accent);
      color: white;
    }

    .grid-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin: 16px 0 8px;
      font-weight: 500;
    }

    .grid-label:first-child {
      margin-top: 0;
    }

    .select-all-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .select-all-btn:hover {
      background: var(--tile-hover);
      color: var(--text);
    }

    .select-all-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Forced 5 columns so rows match traditional order */
    .char-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .char-tile {
      aspect-ratio: 1;
      background: var(--tile);
      border: 2px solid transparent;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.12s;
      user-select: none;
      font-size: 1.35rem;
      position: relative;
    }

    .char-tile .romaji {
      font-size: 0.65rem;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .char-tile:hover {
      background: var(--tile-hover);
    }

    .char-tile.selected {
      background: var(--selected);
      border-color: var(--accent);
    }

    .char-tile.selected .romaji {
      color: #c5b8ff;
    }

    .char-tile .meaning {
      font-size: 0.6rem;
      color: var(--text-dim);
      margin-top: 1px;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 2px;
    }

    .char-tile.selected .meaning {
      color: #c5b8ff;
    }

    /* Delete mode for kanji */
    .char-tile.delete-mode {
      border-color: var(--wrong);
    }

    .char-tile.delete-selected {
      background: rgba(231, 76, 60, 0.25);
      border-color: var(--wrong);
    }

    .delete-bar {
      display: none;
      gap: 10px;
      margin-top: 12px;
    }

    .delete-bar.visible {
      display: flex;
    }

    .delete-bar button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .delete-confirm {
      background: var(--wrong);
      color: white;
    }

    .delete-cancel {
      background: var(--surface2);
      color: var(--text);
    }

    .kanji-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .kanji-toolbar button {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }

    .kanji-toolbar button.active {
      background: rgba(231, 76, 60, 0.2);
      border-color: var(--wrong);
      color: var(--wrong);
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
    }

    .toggle {
      position: relative;
      width: 48px;
      height: 28px;
      background: var(--surface2);
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .toggle.on {
      background: var(--accent);
    }

    .toggle::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle.on::after {
      transform: translateX(20px);
    }

    .direction-select {
      display: flex;
      gap: 8px;
    }

    .dir-btn {
      flex: 1;
      padding: 12px 8px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--surface2);
      color: var(--text-dim);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      line-height: 1.3;
    }

    .dir-btn.active {
      border-color: var(--accent);
      background: var(--selected);
      color: white;
    }

    .dir-btn small {
      display: block;
      font-size: 0.78rem;
      opacity: 0.85;
      margin-top: 2px;
    }

    .start-btn {
      width: 100%;
      padding: 16px;
      margin-top: 8px;
      font-size: 1.15rem;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }

    .start-btn:disabled {
      background: var(--surface2);
      color: var(--text-dim);
      cursor: not-allowed;
    }

    .start-btn:not(:disabled):hover {
      background: var(--accent-hover);
    }

    .deck-count {
      text-align: center;
      color: var(--text-dim);
      font-size: 0.95rem;
      margin: 12px 0 4px;
    }

    .empty-kanji {
      text-align: center;
      color: var(--text-dim);
      padding: 24px 12px;
      font-size: 0.95rem;
    }

    .add-form {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .add-form input {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface2);
      color: var(--text);
      font-size: 1rem;
    }

    .add-form input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .add-btn {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .add-btn:hover {
      background: var(--accent-hover);
    }

    /* ===== SETTINGS SCREEN ===== */
    #settings .theme-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .theme-card {
      padding: 16px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: var(--surface2);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .theme-card:hover {
      border-color: var(--text-dim);
    }

    .theme-card.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .theme-preview {
      height: 36px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      overflow: hidden;
    }

    .theme-preview span {
      flex: 1;
    }

    .theme-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .custom-theme-controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .color-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .color-row label {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
    }

    .color-row input[type="color"] {
      width: 52px;
      height: 36px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: none;
      cursor: pointer;
      padding: 2px;
    }

    .color-row input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .color-row input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 5px;
    }

    .apply-custom-btn {
      margin-top: 6px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .apply-custom-btn:hover {
      background: var(--accent-hover);
    }

    /* ===== GAME ===== */
    #game {
      display: none;
      flex-direction: column;
      height: 100dvh;
      padding: 16px;
      max-width: 520px;
      margin: 0 auto;
      position: relative;
    }

    #game.active {
      display: flex;
    }

    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .game-stats {
      font-size: 0.9rem;
      color: var(--text-dim);
    }

    .card-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .card {
      width: 100%;
      max-width: 300px;
      aspect-ratio: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      transition: transform 0.15s;
    }

    .card .main-char {
      font-size: 5.5rem;
      line-height: 1;
      margin-bottom: 8px;
    }

    .card .hint {
      font-size: 1.1rem;
      color: var(--text-dim);
    }

    .card.wrong-shake {
      animation: shake 0.4s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }

    .answer-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 20px;
    }

    #answer-input {
      width: 100%;
      padding: 16px 18px;
      font-size: 1.3rem;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      color: var(--text);
      text-align: center;
    }

    #answer-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .submit-btn:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .submit-btn:disabled {
      background: var(--surface2);
      color: var(--text-dim);
      cursor: not-allowed;
      opacity: 0.7;
    }

    .feedback {
      text-align: center;
      font-size: 2.4rem;
      font-weight: 800;
      min-height: 64px;
      line-height: 1.25;
      letter-spacing: -0.3px;
    }

    .feedback.correct {
      color: var(--correct);
    }

    .feedback.wrong {
      color: var(--wrong);
    }

    .feedback .correct-answer {
      display: block;
      font-weight: 500;
      font-size: 1.25rem;
      color: var(--text-dim);
      margin-top: 6px;
    }

    .skip-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 0.95rem;
      cursor: pointer;
      padding: 8px;
    }

    .skip-btn:hover {
      color: var(--text);
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <!-- HOME -->
  <div id="home" class="screen active">
    <button class="settings-gear" onclick="showScreen('settings')" title="Settings">⚙</button>
    <div class="logo">Japanese <span>Flash</span></div>
    <div class="subtitle">Hiragana • Katakana • Kanji</div>
    <button class="mode-btn" onclick="openSetup('flash')">Flashcards</button>
    <button class="mode-btn alt" onclick="openSetup('choice')">Multiple Choice</button>
  </div>

  <!-- SETTINGS -->
  <div id="settings" class="screen">
    <div class="header">
      <button class="back-btn" onclick="showScreen('home')">←</button>
      <h1>Settings</h1>
    </div>

    <div class="section">
      <div class="section-title">Preset Themes</div>
      <div class="theme-grid" id="theme-grid"></div>
    </div>

    <div class="section">
      <div class="section-title">Custom Theme</div>
      <div class="custom-theme-controls">
        <div class="color-row">
          <label>Accent</label>
          <input type="color" id="custom-accent" value="#7c5cff" oninput="updateCustomTheme()" />
        </div>
        <div class="color-row">
          <label>Background</label>
          <input type="color" id="custom-bg" value="#0f0f13" oninput="updateCustomTheme()" />
        </div>
        <div class="color-row">
          <label>Surface</label>
          <input type="color" id="custom-surface" value="#1a1a24" oninput="updateCustomTheme()" />
        </div>
        <div class="color-row">
          <label>Text</label>
          <input type="color" id="custom-text" value="#e8e8f0" oninput="updateCustomTheme()" />
        </div>
        <button class="apply-custom-btn" onclick="applyCustomTheme()">Apply Custom Theme</button>
      </div>
    </div>
  </div>

  <!-- SETUP -->
  <div id="setup" class="screen">
    <div class="header">
      <button class="back-btn" onclick="showScreen('home')">←</button>
      <h1>Flashcard Setup</h1>
    </div>

    <!-- QUICK ADD -->
    <div class="section">
      <div class="section-title">Quick Add</div>
      <div class="quick-adds">
        <div class="quick-row">
          <button class="quick-btn" id="qa-hiragana" onclick="toggleQuick('hiragana')">All Hiragana</button>
          <button class="quick-btn" id="qa-katakana" onclick="toggleQuick('katakana')">All Katakana</button>
          <button class="quick-btn" id="qa-kanji" onclick="toggleQuick('kanji')">All Custom Kanji</button>
        </div>
        <button class="quick-btn clear-btn" onclick="clearSelection()">Clear All</button>
      </div>
    </div>

    <!-- Character selection -->
    <div class="section">
      <div class="section-title">Select Characters</div>
      <div class="script-tabs">
        <button class="script-tab active" data-script="hiragana" onclick="switchScript('hiragana')">Hiragana</button>
        <button class="script-tab" data-script="katakana" onclick="switchScript('katakana')">Katakana</button>
        <button class="script-tab" data-script="kanji" onclick="switchScript('kanji')">Kanji</button>
      </div>

      <div id="grids-container"></div>
    </div>

    <!-- Settings -->
    <div class="section">
      <div class="section-title">Game Settings</div>
      <div class="settings-row">
        <span>Infinite mode (weighted random)</span>
        <div id="infinite-toggle" class="toggle on" onclick="toggleInfinite()"></div>
      </div>
      <div class="settings-row" style="flex-direction:column;align-items:stretch;gap:8px;">
        <span>Direction</span>
        <div class="direction-select">

    function getWeight(key) {
      return weights[key] ?? 5;
    }

    function adjustWeight(key, correct) {
      let w = getWeight(key);
      if (correct) w = Math.max(1, w - 1);
      else w = Math.min(50, w + 3);
      weights[key] = w;
      saveWeights();
    }

    // ===================== THEME =====================
    function hexToRgb(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return { r, g, b };
    }

    function lighten(hex, amount) {
      const { r, g, b } = hexToRgb(hex);
      const nr = Math.min(255, Math.round(r + (255 - r) * amount));
      const ng = Math.min(255, Math.round(g + (255 - g) * amount));
      const nb = Math.min(255, Math.round(b + (255 - b) * amount));
      return `#${nr.toString(16).padStart(2, "0")}${ng.toString(16).padStart(2, "0")}${nb.toString(16).padStart(2, "0")}`;
    }

    function darken(hex, amount) {
      const { r, g, b } = hexToRgb(hex);
      const nr = Math.max(0, Math.round(r * (1 - amount)));
      const ng = Math.max(0, Math.round(g * (1 - amount)));
      const nb = Math.max(0, Math.round(b * (1 - amount)));
      return `#${nr.toString(16).padStart(2, "0")}${ng.toString(16).padStart(2, "0")}${nb.toString(16).padStart(2, "0")}`;
    }

    function applyThemeVars(t) {
      const root = document.documentElement;
      root.style.setProperty("--accent", t.accent);
      root.style.setProperty("--accent-hover", t.accentHover);
      root.style.setProperty("--selected", t.selected);
      root.style.setProperty("--accent-soft", t.accentSoft);
      root.style.setProperty("--bg", t.bg);
      root.style.setProperty("--surface", t.surface);
      root.style.setProperty("--surface2", t.surface2);
      root.style.setProperty("--border", t.border);
      root.style.setProperty("--tile", t.tile);
      root.style.setProperty("--tile-hover", t.tileHover);
      if (t.text) root.style.setProperty("--text", t.text);
      if (t.textDim) root.style.setProperty("--text-dim", t.textDim);
    }

    function applyTheme(id) {
      const t = THEMES[id];
      if (!t) return;
      currentTheme = id;
      applyThemeVars(t);
      // reset text to defaults when using presets
      document.documentElement.style.setProperty("--text", "#e8e8f0");
      document.documentElement.style.setProperty("--text-dim", "#9999b0");
      saveTheme();
      renderThemeGrid();
      syncCustomPickersFromTheme(t);
    }

    function buildCustomThemeFromPickers() {
      const accent = document.getElementById("custom-accent").value;
      const bg = document.getElementById("custom-bg").value;
      const surface = document.getElementById("custom-surface").value;
      const text = document.getElementById("custom-text").value;

      const surface2 = lighten(surface, 0.12);
      const border = lighten(surface, 0.22);
      const tile = lighten(surface, 0.08);
      const tileHover = lighten(surface, 0.18);
      const selected = darken(accent, 0.35);
      const accentHover = lighten(accent, 0.2);
      const { r, g, b } = hexToRgb(accent);
      const accentSoft = `rgba(${r}, ${g}, ${b}, 0.18)`;
      const textDim = lighten(text, 0.35);

      return {
        accent, accentHover, selected, accentSoft,
        bg, surface, surface2, border, tile, tileHover,
        text, textDim
      };
    }

    function updateCustomTheme() {
      // live preview while dragging colors
      const t = buildCustomThemeFromPickers();
      applyThemeVars(t);
      document.documentElement.style.setProperty("--text", t.text);
      document.documentElement.style.setProperty("--text-dim", t.textDim);
    }

    function applyCustomTheme(fromLoad = false) {
      const t = fromLoad && customThemeData ? customThemeData : buildCustomThemeFromPickers();
      customThemeData = t;
      currentTheme = "custom";
      applyThemeVars(t);
      document.documentElement.style.setProperty("--text", t.text);

      saveCustomThemeData();
      renderThemeGrid();

        document.getElementById("custom-surface").value = t.surface;

    function syncCustomPickersFromTheme(t) {
      const accentEl = document.getElementById("custom-accent");

      document.getElementById("custom-surface").value = t.surface;

    function renderThemeGrid() {
      const grid = document.getElementById("theme-grid");
      if (!grid) return;
      let html = Object.entries(THEMES).map(([id, t]) => `
        <div class="theme-card ${id === currentTheme ? "active" : ""}" onclick="applyTheme('${id}')">
          <div class="theme-preview">
            <span style="background:${t.bg}"></span>
            <span style="background:${t.surface}"></span>
            <span style="background:${t.accent}"></span>
          </div>
          <div class="theme-name">${t.name}</div>
        </div>
      `).join("");

      // Custom card
      const isCustom = currentTheme === "custom";
      const previewAccent = customThemeData ? customThemeData.accent : "#7c5cff";
      const previewBg = customThemeData ? customThemeData.bg : "#0f0f13";
      const previewSurface = customThemeData ? customThemeData.surface : "#1a1a24";
      html += `
        <div class="theme-card ${isCustom ? "active" : ""}" onclick="applyCustomTheme()">
          <div class="theme-preview">
            <span style="background:${previewBg}"></span>
            <span style="background:${previewSurface}"></span>
            <span style="background:${previewAccent}"></span>
          </div>
          <div class="theme-name">Custom</div>
        </div>
      `;
      grid.innerHTML = html;
    }

      deleteMode = false;
      deleteSelected.clear();
      document.querySelectorAll(".script-tab").forEach(t => {
        t.classList.toggle("active", t.dataset.script === script);
      });
      renderGrids();
    }

    function makeKey(script, char) {
      return script === "hiragana" ? `hira-${char}` : `kata-${char}`;
    }

    function makeKanjiKey(idx) {
      return `kanji-${idx}`;
    }

    // ===================== GRIDS & SELECTION =====================
    function getAllKeysForScript(script) {
      if (script === "hiragana") {
        return [...HIRAGANA_BASIC, ...HIRAGANA_DAKU, ...HIRAGANA_YOON].map(i => makeKey("hiragana", i.char));
      }
      if (script === "katakana") {
        return [...KATAKANA_BASIC, ...KATAKANA_DAKU, ...KATAKANA_YOON].map(i => makeKey("katakana", i.char));
      }
      if (script === "kanji") {
        return customKanji.map((_, idx) => makeKanjiKey(idx));
      }
      return [];
    }

    function getGroupKeys(script, group) {
      if (script === "hiragana") {
        if (group === "basic") return HIRAGANA_BASIC.map(i => makeKey("hiragana", i.char));
        if (group === "daku") return HIRAGANA_DAKU.map(i => makeKey("hiragana", i.char));
        if (group === "yoon") return HIRAGANA_YOON.map(i => makeKey("hiragana", i.char));
      }
      if (script === "katakana") {
        if (group === "basic") return KATAKANA_BASIC.map(i => makeKey("katakana", i.char));
        if (group === "daku") return KATAKANA_DAKU.map(i => makeKey("katakana", i.char));
        if (group === "yoon") return KATAKANA_YOON.map(i => makeKey("katakana", i.char));
      }
      return [];
    }

    function isGroupFullySelected(script, group) {
      const keys = getGroupKeys(script, group);
      return keys.length > 0 && keys.every(k => selected.has(k));
    }

    function toggleGroup(script, group) {
      const keys = getGroupKeys(script, group);
      const allSelected = keys.every(k => selected.has(k));
      if (allSelected) keys.forEach(k => selected.delete(k));
      else keys.forEach(k => selected.add(k));
      renderGrids();
      updateQuickButtons();
      updateDeckCount();
    }

    function renderGrids() {
      const container = document.getElementById("grids-container");

      if (currentScript === "kanji") {
        let html = `
          <div class="add-form">
            <input id="kanji-char" type="text" placeholder="Kanji (e.g. 水)" maxlength="4" />
            <input id="kanji-reading" type="text" placeholder="Romaji reading (e.g. mizu)" />
            <input id="kanji-meaning" type="text" placeholder="Meaning (e.g. water)" />
            <button class="add-btn" onclick="addCustomKanji()">Add Kanji</button>
          </div>
        `;

        if (customKanji.length === 0) {
          html += `<div class="empty-kanji">No custom kanji yet.<br>Add some above!</div>`;
        } else {
          html += `
            <div class="kanji-toolbar">
              <button class="${deleteMode ? "active" : ""}" onclick="toggleDeleteMode()">
                ${deleteMode ? "Cancel Delete" : "Delete Mode"}
              </button>
            </div>
            <div class="grid-label">
              Your Kanji
              <button class="select-all-btn ${quickState.kanji ? "active" : ""}" onclick="toggleQuick('kanji')">
                ${quickState.kanji ? "Deselect All" : "Select All"}
              </button>
            </div>
            <div class="char-grid">
          `;

          customKanji.forEach((k, idx) => {
            const key = makeKanjiKey(idx);
            let cls = "char-tile";
            if (deleteMode) {
              cls += " delete-mode";
              if (deleteSelected.has(idx)) cls += " delete-selected";
            } else if (selected.has(key)) {
              cls += " selected";
            }
            html += `<div class="${cls}" data-key="${key}" data-idx="${idx}" onclick="handleKanjiClick(${idx})">
              <span>${k.char}</span>
              <span class="romaji">${k.reading}</span>
              ${k.meaning ? `<span class="meaning">${k.meaning}</span>` : ""}
            </div>`;
          });
          html += `</div>`;

          html += `
            <div class="delete-bar ${deleteMode && deleteSelected.size > 0 ? "visible" : ""}" id="delete-bar">
              <button class="delete-cancel" onclick="toggleDeleteMode()">Cancel</button>
              <button class="delete-confirm" onclick="confirmDeleteKanji()">Delete ${deleteSelected.size} selected</button>
            </div>
          `;
        }
        container.innerHTML = html;
        return;
      }

      // Hiragana / Katakana
      const isHira = currentScript === "hiragana";
      const basic = isHira ? HIRAGANA_BASIC : KATAKANA_BASIC;
      const daku = isHira ? HIRAGANA_DAKU : KATAKANA_DAKU;
      const yoon = isHira ? HIRAGANA_YOON : KATAKANA_YOON;

      function makeGrid(items, label, group) {
        const fully = isGroupFullySelected(currentScript, group);
        let html = `<div class="grid-label">
          ${label}
          <button class="select-all-btn ${fully ? "active" : ""}" onclick="toggleGroup('${currentScript}', '${group}')">
            ${fully ? "Deselect All" : "Select All"}
          </button>
        </div>
        <div class="char-grid">`;
        for (const item of items) {
          const key = makeKey(currentScript, item.char);
          const sel = selected.has(key) ? "selected" : "";
          html += `<div class="char-tile ${sel}" data-key="${key}" onclick="toggleTile('${key}')">
            <span>${item.char}</span>
            <span class="romaji">${item.reading}</span>
          </div>`;
        }
        html += `</div>`;
        return html;
      }

      container.innerHTML =
        makeGrid(basic, "Basic", "basic") +
        makeGrid(daku, "Dakuten / Handakuten", "daku") +
        makeGrid(yoon, "Yōon Combinations", "yoon");
    }

    function toggleTile(key) {
      if (selected.has(key)) selected.delete(key);
      else selected.add(key);
      renderGrids();
      updateQuickButtons();
      updateDeckCount();
    }

    function handleKanjiClick(idx) {
      if (deleteMode) {
        if (deleteSelected.has(idx)) deleteSelected.delete(idx);
        else deleteSelected.add(idx);
        renderGrids();
      } else {
        const key = makeKanjiKey(idx);
        toggleTile(key);
      }
    }

    function toggleDeleteMode() {
      deleteMode = !deleteMode;
      deleteSelected.clear();
      renderGrids();
    }

    function confirmDeleteKanji() {
      if (deleteSelected.size === 0) return;
      const count = deleteSelected.size;
      if (!confirm(`Delete ${count} kanji? This cannot be undone.`)) return;

      // Remove from highest index to lowest so indices stay valid
      const indices = Array.from(deleteSelected).sort((a, b) => b - a);
      indices.forEach(idx => {
        const key = makeKanjiKey(idx);
        selected.delete(key);
        customKanji.splice(idx, 1);
      });

      // Clear kanji keys from both mode selections (indices shifted)
      selectedFlash = new Set([...selectedFlash].filter(k => !k.startsWith("kanji-")));
      selectedChoice = new Set([...selectedChoice].filter(k => !k.startsWith("kanji-")));
      selected = studyMode === "flash" ? selectedFlash : selectedChoice;

      saveCustom();
      deleteMode = false;
      deleteSelected.clear();
      renderGrids();
      updateQuickButtons();
      updateDeckCount();
    }

    function toggleQuick(type) {
      const keys = getAllKeysForScript(type);
      const allSelected = keys.length > 0 && keys.every(k => selected.has(k));
      if (allSelected) {
        keys.forEach(k => selected.delete(k));
        quickState[type] = false;
      } else {
        keys.forEach(k => selected.add(k));
        quickState[type] = true;
      }
      renderGrids();
      updateQuickButtons();
      updateDeckCount();
    }

    function updateQuickButtons() {
      ["hiragana", "katakana", "kanji"].forEach(type => {
        const keys = getAllKeysForScript(type);
        quickState[type] = keys.length > 0 && keys.every(k => selected.has(k));
        const btn = document.getElementById(`qa-${type}`);
        if (btn) btn.classList.toggle("active", quickState[type]);
      });
    }

    function clearSelection() {
      selected.clear();
      quickState = { hiragana: false, katakana: false, kanji: false };
      renderGrids();
      updateQuickButtons();
      updateDeckCount();
    }

    function updateDeckCount() {
      const count = selected.size;
      const pass = infinite ? "" : " · one pass";
      document.getElementById("deck-count").textContent = `${count} character${count !== 1 ? "s" : ""} selected${pass}`;
      document.getElementById("start-btn").disabled = count === 0;
      saveSelected();
    }

    // ===================== CUSTOM KANJI =====================
    function addCustomKanji() {
      const charInput = document.getElementById("kanji-char");
      const readingInput = document.getElementById("kanji-reading");
      const meaningInput = document.getElementById("kanji-meaning");
      if (!charInput || !readingInput) return;

      const char = charInput.value.trim();
      const reading = readingInput.value.trim().toLowerCase();
      const meaning = meaningInput.value.trim();

      if (!char || !reading) {
        alert("Please enter at least the kanji and its romaji reading.");
        return;
      }

      customKanji.push({ char, reading, meaning });
      saveCustom();

      const newIdx = customKanji.length - 1;
      selected.add(makeKanjiKey(newIdx));

      charInput.value = "";
      readingInput.value = "";
      meaningInput.value = "";

      renderGrids();
      updateQuickButtons();
      updateDeckCount();
    }

    // ===================== SETTINGS =====================
    function toggleInfinite() {
      infinite = !infinite;
      if (studyMode === "flash") infiniteFlash = infinite;
      else infiniteChoice = infinite;
      document.getElementById("infinite-toggle").classList.toggle("on", infinite);
      saveModePrefs();
      updateDeckCount();
    }

    function setDirection(dir) {
      direction = dir;
      if (studyMode === "flash") directionFlash = dir;
      else directionChoice = dir;
      document.querySelectorAll(".dir-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.dir === dir);
      });
      saveModePrefs();
    }

    // ===================== GAME =====================
    function buildDeck() {
      deck = [];
      [...HIRAGANA_BASIC, ...HIRAGANA_DAKU, ...HIRAGANA_YOON].forEach(item => {
        const key = makeKey("hiragana", item.char);
        if (selected.has(key)) deck.push({ key, char: item.char, reading: item.reading, type: "kana" });
      });
      [...KATAKANA_BASIC, ...KATAKANA_DAKU, ...KATAKANA_YOON].forEach(item => {
        const key = makeKey("katakana", item.char);
        if (selected.has(key)) deck.push({ key, char: item.char, reading: item.reading, type: "kana" });
      });
      customKanji.forEach((k, idx) => {
        const key = makeKanjiKey(idx);
        if (selected.has(key)) deck.push({ key, char: k.char, reading: k.reading, meaning: k.meaning, type: "kanji" });
      });
    }

    function pickWeighted() {
      if (deck.length === 0) return null;
      let total = 0;
      const weighted = deck.map(c => {
        const w = getWeight(c.key);
        total += w;
        return { card: c, weight: w };
      });
      let r = Math.random() * total;
      for (const item of weighted) {
        r -= item.weight;
        if (r <= 0) return item.card;
      }
      return weighted[weighted.length - 1].card;
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function answerOf(card) {
      return direction === "char-to-reading" ? card.reading : card.char;
    }

    function buildChoices(card) {
      const correct = answerOf(card);
      const pool = new Set();
      deck.forEach(other => {
        const v = answerOf(other);
        if (v !== correct) pool.add(v);
      });
      [...HIRAGANA_BASIC, ...HIRAGANA_DAKU, ...HIRAGANA_YOON,
       ...KATAKANA_BASIC, ...KATAKANA_DAKU, ...KATAKANA_YOON].forEach(item => {
        const v = direction === "char-to-reading" ? item.reading : item.char;
        if (v !== correct) pool.add(v);
      });
      return shuffle([correct, ...shuffle([...pool]).slice(0, 3)]);
    }

    function renderChoices() {
      const grid = document.getElementById("choice-grid");
      if (!grid || !currentCard) return;
      const expected = answerOf(currentCard);
      const kana = direction === "reading-to-char";
      grid.innerHTML = choiceOptions.map(v => {
        return `<button class="choice-btn ${kana ? "kana" : ""}" data-val="${v.replace(/"/g, "&quot;")}" onclick="pickChoice(this)">${v}</button>`;
      }).join("");
    }

    function pickChoice(btn) {
      if (waitingForNext || !currentCard) return;
      const val = btn.getAttribute("data-val");
      const expected = answerOf(currentCard);
      const ok = val === expected;
      stats.total++;
      if (ok) {
        stats.correct++;
        adjustWeight(currentCard.key, true);
        fireConfetti();
      } else {
        adjustWeight(currentCard.key, false);
      }
      document.querySelectorAll(".choice-btn").forEach(b => {
        b.disabled = true;
        if (b.getAttribute("data-val") === expected) b.classList.add("correct");
        if (b === btn && !ok) b.classList.add("wrong");
      });
      const fb = document.getElementById("feedback");
      if (ok) {
        fb.innerHTML = "Correct!";
        fb.className = "feedback correct";
      } else {
        fb.innerHTML = `Wrong<br><span class="correct-answer">Answer: ${expected}${currentCard.meaning ? " — " + currentCard.meaning : ""}</span>`;
        fb.className = "feedback wrong";
        document.getElementById("card").classList.add("wrong-shake");
      }
      waitingForNext = true;
      updateGameStats();
      setTimeout(() => advanceAfterAnswer(), ok ? 800 : 1400);
    }

    function updateGameStats() {
      let extra = "";
      if (!infinite && finiteQueue.length) extra = ` · ${finiteIndex + 1}/${finiteQueue.length}`;
      document.getElementById("game-stats").textContent = `${stats.correct} correct • ${stats.total} total${extra}`;
    }

    function nextCard() {
      waitingForNext = false;
      document.getElementById("feedback").textContent = "";
      document.getElementById("feedback").className = "feedback";
      document.getElementById("answer-input").value = "";
      document.getElementById("card").classList.remove("wrong-shake");
      updateSubmitButton();

      if (deck.length === 0) {
        alert("Deck is empty!");
        showScreen("setup");
        return;
      }

      if (infinite) {
        currentCard = pickWeighted();
      } else {
        if (finiteIndex >= finiteQueue.length) {
          showResults();
          return;
        }
        currentCard = finiteQueue[finiteIndex];
      }

      const main = document.getElementById("card-main");
      const hint = document.getElementById("card-hint");

      if (direction === "char-to-reading") {
        main.textContent = currentCard.char;
        hint.textContent = currentCard.type === "kanji" && currentCard.meaning ? currentCard.meaning : "";
      } else {
        main.textContent = currentCard.reading;
        hint.textContent = currentCard.type === "kanji" && currentCard.meaning ? `(${currentCard.meaning})` : (studyMode === "flash" ? "type the character" : "pick the character");
      }

      if (studyMode === "choice") {
        choiceOptions = buildChoices(currentCard);
        renderChoices();
      } else {
        document.getElementById("answer-input").focus();
      }
      updateGameStats();
    }

    function advanceAfterAnswer() {
      if (!infinite) {
        finiteIndex++;
        if (finiteIndex >= finiteQueue.length) {
          showResults();
          return;
        }
      }
      nextCard();
    }

    function showResults() {
      const pct = stats.total ? Math.round((stats.correct / stats.total) * 100) : 0;
      const ms = Date.now() - sessionStarted;
      const s = Math.round(ms / 1000);
      const clock = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
      document.getElementById("results-mode-label").textContent = studyMode === "flash" ? "Flashcards" : "Multiple Choice";
      const pctEl = document.getElementById("results-pct");
      pctEl.textContent = pct + "%";
      pctEl.className = "results-pct" + (pct >= 80 ? " good" : "");
      document.getElementById("results-title").textContent = pct === 100 ? "Perfect" : pct >= 80 ? "Nice run" : "Run complete";
      document.getElementById("results-sub").textContent = `${stats.correct} / ${stats.total} correct · ${clock}`;
      showScreen("results");
      if (pct === 100) fireConfetti(120);
      else if (pct >= 80) fireConfetti(60);
    }

    function normalize(str) {
      return str.trim().toLowerCase().replace(/\s+/g, "");
    }

    function updateSubmitButton() {
      const input = document.getElementById("answer-input");
      const btn = document.getElementById("submit-btn");
      const hasText = input.value.trim().length > 0;
      btn.disabled = !hasText || waitingForNext;
    }

    function checkAnswer() {
      if (waitingForNext || !currentCard) return;
      const input = normalize(document.getElementById("answer-input").value);
      if (!input) return; // empty = do nothing

      let correct = false;
      if (direction === "char-to-reading") {
        correct = input === normalize(currentCard.reading) || input === currentCard.char;
        if (currentCard.type === "kanji" && currentCard.meaning && input === normalize(currentCard.meaning)) {
          correct = true;
        }
      } else {
        correct = input === currentCard.char || input === normalize(currentCard.reading);
      }

      stats.total++;
      const fb = document.getElementById("feedback");

      if (correct) {
        stats.correct++;
        adjustWeight(currentCard.key, true);
        fb.innerHTML = "Correct!";
        fb.className = "feedback correct";
        fireConfetti();
        waitingForNext = true;
        updateSubmitButton();
        updateGameStats();
        setTimeout(advanceAfterAnswer, 900);
      } else {
        adjustWeight(currentCard.key, false);
        let expected = direction === "char-to-reading" ? currentCard.reading : currentCard.char;
        fb.innerHTML = `Wrong<br><span class="correct-answer">Answer: ${expected}${currentCard.type === "kanji" && currentCard.meaning ? " — " + currentCard.meaning : ""}</span>`;
        fb.className = "feedback wrong";
        document.getElementById("card").classList.add("wrong-shake");
        waitingForNext = true;
        updateSubmitButton();
        updateGameStats();
        setTimeout(advanceAfterAnswer, 1500);
      }
    }

    function skipCard() {
      if (waitingForNext || !currentCard) return;
      adjustWeight(currentCard.key, false);
      stats.total++;
      updateGameStats();
      if (!infinite) {
        finiteIndex++;
        if (finiteIndex >= finiteQueue.length) {
          showResults();
          return;
        }
      }
      nextCard();
    }

    function startGame() {
      buildDeck();
      if (deck.length === 0) return;
      stats = { correct: 0, total: 0 };
      sessionStarted = Date.now();
      finiteQueue = infinite ? [] : shuffle(deck);
      finiteIndex = 0;
      showScreen("game");
      nextCard();
    }

    // ===================== CONFETTI =====================
    function fireConfetti(count) {
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#7c5cff";
      const colors = [accent, "#2ecc71", "#f1c40f", "#e74c3c", "#3498db", "#e91e63"];
      const n = count || 80;

      const particles = [];
      for (let i = 0; i < n; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2 - 80,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.8) * 10,
          w: Math.random() * 8 + 4,
          h: Math.random() * 6 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 60 + Math.random() * 30,
          rot: Math.random() * Math.PI,
          vr: (Math.random() - 0.5) * 0.3
        });
      }

      let frame = 0;
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;
        for (const p of particles) {
          if (p.life <= 0) continue;
          alive = true;
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.25;
          p.rot += p.vr;
          p.life--;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.min(1, p.life / 20);
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
        if (alive && frame < 90) {
          frame++;
          requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      animate();
    }

    // ===================== EVENTS =====================
    document.getElementById("answer-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        checkAnswer();
      }
    });

    document.getElementById("answer-input").addEventListener("input", updateSubmitButton);

    // ===================== INIT =====================
    loadStorage();
    renderGrids();
    updateQuickButtons();
    updateDeckCount();
  </script>
</body>
</html>
